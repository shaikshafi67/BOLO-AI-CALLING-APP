# Builds the React web app (web/) and publishes the finished site to the
# `hostinger-web` branch. Hostinger's Git deployment pulls that branch into
# public_html, so every push here updates the live website.
name: Deploy website

on:
  push:
    branches: [master, feature/presence-push-android-translation]
    paths: ['web/**', '.github/workflows/deploy-web.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy-web
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci

      - name: Build
        run: npm run build
        env:
          # The live backend on Render (see render.yaml).
          VITE_API_BASE_URL: https://boloai-backend.onrender.com/api
          VITE_SIGNALING_URL: https://boloai-backend.onrender.com

      - name: Publish to the hostinger-web branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: web/dist
          publish_branch: hostinger-web
          force_orphan: true
          commit_message: 'Website build'
